<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simulateur radar</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:#050d14;color:#cfe8ff;font:15px/1.4 system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column}
button,input{font:inherit;color:#cfe8ff;background:#12293b;border:1px solid #2a5a72;border-radius:8px;padding:9px 12px}
button:focus-visible,input:focus-visible{outline:2px solid #8fd8ff;outline-offset:1px}
button.on{background:#1f4d66;border-color:#8fd8ff}
#tabs{display:flex;gap:8px;padding:8px 10px 0}
#tabs button{flex:1;min-width:0;padding:8px 2px;font-size:13px}
#msg{font-size:13px;color:#7ee0a5;padding:6px 12px;min-height:2em}
#stage{position:relative;flex:1;min-height:0}
canvas{width:100%;height:100%;display:block;touch-action:none;position:relative;z-index:1}
.z{position:absolute;right:10px;width:40px;padding:6px 0}
#info{font-size:13px;padding:8px 12px;max-height:28%;overflow:auto;border-top:1px solid #1a3a52;color:#9fd6f0}
#info div{margin-bottom:3px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px}
#chips button{white-space:nowrap;padding:7px 11px;font-size:14px}
#f{display:flex;gap:8px;padding:0 10px 10px}
#f input{flex:1;min-width:0}
</style>
</head>
<body>
<div id="tabs"><button id="tp" class="on">Plan</button><button id="ts">Scan</button><button id="tw">Visite</button><button id="tg">Jeu</button><button id="tc">Comparer</button></div>
<div id="msg" role="status"></div>
<div id="stage"><canvas id="cv" aria-label="Plan ou scan 3D de la pièce"></canvas>
<button class="z" id="zi" style="bottom:56px" aria-label="Zoom avant">+</button><button class="z" id="zo" style="bottom:10px" aria-label="Zoom arrière">−</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<div id="info"></div>
<div id="chips"></div>
<form id="f"><input id="txt" placeholder="Ex : random · lit au nord · 5x4 · personne ici" autocomplete="off"><button>Envoyer</button></form>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),cx=cv.getContext('2d');

const SYN=[['lit',/\blits?\b/],['armoire',/armoire|placard/],['bureau',/bureau/],['chaise',/chaise|fauteuil/],['tv',/\btv\b|tele|television|ecran/],['canape',/canape|sofa/],['table',/\btables?\b/],['etagere',/etagere|bibliotheque|commode/]];
let W=0,H=0,view='plan',yaw=.6,tilt=.6,zoom=1,cursor=null,armed=null;
let room={w:4,d:3.5},items=[],people=[],radar={x:2,y:1.75,z:1},P=[];
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.min(b,Math.max(a,v)),f1=n=>n.toFixed(1).replace('.',',');

function pl(){const s=Math.min((W-24)/room.w,(H-24)/room.d);return{s,ox:(W-room.w*s)/2,oy:(H-room.d*s)/2}}

function scan(){const it0=items.find(i=>Math.abs(radar.x-i.x)<i.w/2&&Math.abs(radar.y-i.y)<i.d/2);radar.z=it0?Math.max(1,it0.h+.1):1;

function dir(dx,dy){const a=Math.atan2(-dy,dx)*180/Math.PI;return['est','nord-est','nord','nord-ouest','ouest','sud-ouest','sud','sud-est'][Math.round(((a+360)%360)/45)%8]}
function info(){const L=[];

cx.fillStyle='#4a7c94';cx.fillText('Nord',W/2,oy-8>6?oy-8:8)}
function draw3(t){cx.fillStyle='#000';cx.fillRect(0,0,W,H);

const LB={armoire:'armoire',chaise:'chaise',tv:'télé',canape:'canapé',lit:'lit',table:'table ou bureau',objet:'objet',personne:'personne'};
let cam=null,joy=null,lk=null,keys={},lastT=0,decor=[],gm=false;
function cls(mn,mx){const dx=mx[0]-mn[0],dy=mx[1]-mn[1],w=Math.max(dx,dy),d=Math.min(dx,dy),h=mx[2];
if(h>=1.5)return'armoire';if(w<.65&&h>=.5)return'chaise';if(d<.55&&w<1.6&&h>=.8)return'tv';if(w>=1.6&&h>=.6&&h<1.2&&d<1.2)return'canape';if(h<.7&&w>=1.4)return'lit';if(h>=.55&&h<.95&&w>=.8)return'table';return'objet'}
function buildDecor(){decor=[];items.forEach((it,id)=>{const v=P.filter(q=>q.k==='i'&&q.id===id);if(v.length<8)return;const mn=[1e9,1e9,0],mx=[-1e9,-1e9,0];v.forEach(q=>{for(let i=0;i<3;i++){mn[i]=Math.min(mn[i],q.p[i]);mx[i]=Math.max(mx[i],q.p[i])}});mn[2]=0;decor.push({c:cls(mn,mx),mn,mx})});

function drawWalk(t){const dt=Math.min(.05,(t-lastT)/1000)||0;lastT=t;

if(gm){game(t,dt,fw,sd);return}

[[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],0,-1,0,.55],[[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],0,1,0,.55],[[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1],-1,0,0,.7],[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],1,0,0,.7],[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],0,0,1,.95]].forEach(f=>{

const a=d.mn,b=d.mx,mx_=(a[0]+b[0])/2,my_=(a[1]+b[1])/2,hw=(b[0]-a[0])/2||.1,hd=(b[1]-a[1])/2||.1,h=b[2],fx=Math.abs(radar.x-mx_)/hw>Math.abs(radar.y-my_)/hd,sx=radar.x>mx_?1:-1,sy=radar.y>my_?1:-1,fv=sx>0?b[0]:a[0],fy=sy>0?b[1]:a[1];

function rand(){room={w:+rnd(3.2,6.5).toFixed(1),d:+rnd(3,5).toFixed(1)};items=[];people=[];cursor=null;radar={x:room.w/2,y:room.d/2,z:1,yaw:Math.random()*6.28};extra=[];
const ks=Object.keys(T).filter(k=>k!=='chaise').sort(()=>Math.random()-.5).slice(0,3+Math.floor(Math.random()*3));if(Math.random()<.6)ks.push('chaise');
ks.forEach(k=>{const t=T[k],sw=Math.random()<.5,w=sw?t.d:t.w,d=sw?t.w:t.d,[x,y]=free(w,d);items.push({k,n:t.n,w,d,h:t.h,x,y})});
const np=Math.floor(Math.random()*3);for(let i=0;i<np;i++){const[x,y]=free(.4,.4);people.push({x,y})}
const[rx,ry]=free(.3,.3);radar.x=rx;radar.y=ry;msg('Pièce aléatoire : '+ks.map(k=>T[k].n).join(', ')+'.');refresh()}
function run(raw){const tx=norm(raw);if(!tx.trim())return;
const mw=raw.match(/wss?:\/\/\S+/i);if(mw){connect(mw[0]);return}
if(/random|aleatoire|hasard|surprise/.test(tx)){rand();return}
const found=SYN.filter(([k,r])=>r.test(tx)).map(a=>a[0]),wp=/personne|quelqu|humain|intrus|cambrioleur/.test(tx),wr=/radar|scanner|capteur|boitier/.test(tx),rem=/supprime|enleve|retire|efface/.test(tx),done=[];
const m=tx.match(/(\d+(?:[.,]\d+)?)\s*m?\s*(?:x|par|sur|\*)\s*(\d+(?:[.,]\d+)?)/);
if(m){room.w=cl(parseFloat(m[1].replace(',','.')),2,9);room.d=cl(parseFloat(m[2].replace(',','.')),2,9);items.forEach(i=>{i.x=cl(i.x,i.w/2,Math.max(i.w/2,room.w-i.w/2));i.y=cl(i.y,i.d/2,Math.max(i.d/2,room.d-i.d/2))});people.forEach(p=>{p.x=cl(p.x,0,room.w);p.y=cl(p.y,0,room.d)});radar.x=cl(radar.x,0,room.w);radar.y=cl(radar.y,0,room.d);done.push('pièce '+f1(room.w)+' × '+f1(room.d)+' m')}
if(/efface|vide|reset|recommence/.test(tx)&&!found.length&&!wp){items=[];people=[];cursor=null;done.push('pièce vidée')}
else if(rem){found.forEach(k=>{const i=items.map(o=>o.k).lastIndexOf(k);if(i>=0){items.splice(i,1);done.push(T[k].n+' retiré')}});if(wp&&people.length){people.pop();done.push('personne retirée')}}
else{found.forEach(k=>{const t=T[k],[x,y]=spot(tx,t.w,t.d);put(k,x,y);done.push(t.n+' ajouté')});
if(wp){const[x,y]=spot(tx,.4,.4);put('personne',x,y);done.push('personne ajoutée')}
if(wr){const[x,y]=spot(tx,.3,.3);put('radar',x,y);done.push('radar déplacé')}}
msg(done.length?done.join(' · ')+'.':'Je n\'ai pas compris. Essayez : random, lit au nord, 5x4, personne ici, radar au centre.');refresh()}
function tap(e){const r=cv.getBoundingClientRect(),{s,ox,oy}=pl(),x=(e.clientX-r.left-ox)/s,y=(e.clientY-r.top-oy)/s;if(x<0||y<0||x>room.w||y>room.d)return;
if(armed){put(armed,x,y);msg((armed==='radar'?'Radar':armed==='personne'?'Personne':T[armed].n)+' placé.');armed=null;refresh()}
else{cursor=[x,y];msg('Position choisie. Touchez un bouton ou écrivez ce que vous voulez y mettre.')}}
function chip(k){if(cursor){put(k,cursor[0],cursor[1]);cursor=null;msg('Placé.');refresh()}else{armed=k;msg('Touchez le plan pour placer.')}}
let dr=null,mv=0;
cv.onpointerdown=e=>{aud();cv.setPointerCapture(e.pointerId);if(view==='walk'){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(x<W*.45&&!joy)joy={id:e.pointerId,ox:x,oy:y,dx:0,dy:0};else if(!lk)lk={id:e.pointerId,x:e.clientX,y:e.clientY};return}dr=[e.clientX,e.clientY];mv=0};
cv.onpointercancel=()=>{joy=null;lk=null;dr=null};
cv.onpointermove=e=>{if(view==='walk'){const r=cv.getBoundingClientRect();if(joy&&joy.id===e.pointerId){joy.dx=e.clientX-r.left-joy.ox;joy.dy=e.clientY-r.top-joy.oy}else if(lk&&lk.id===e.pointerId&&cam){cam.yaw+=(e.clientX-lk.x)*.006;cam.pit=cl(cam.pit-(e.clientY-lk.y)*.005,-1,1);lk.x=e.clientX;lk.y=e.clientY}return}if(!dr)return;const dx=e.clientX-dr[0],dy=e.clientY-dr[1];mv+=Math.abs(dx)+Math.abs(dy);if(view==='scan'){yaw+=dx*.008;tilt=cl(tilt+dy*.006,.1,1.45)}dr=[e.clientX,e.clientY]};
cv.onpointerup=e=>{if(joy&&joy.id===e.pointerId)joy=null;if(lk&&lk.id===e.pointerId)lk=null;if(dr&&mv<8&&view==='plan')tap(e);dr=null};
function setView(v,g){view=v;gm=!!g;gc.style.display='none';$('info').style.display=v==='walk'&&g?'none':'';sb.style.display=v==='walk'&&g?'block':'none';$('tp').classList.toggle('on',v==='plan');$('ts').classList.toggle('on',v==='scan');$('tw').classList.toggle('on',v==='walk'&&!g);$('tg').classList.toggle('on',v==='walk'&&!!g);$('tc').classList.toggle('on',v==='cmp');document.querySelectorAll('.z').forEach(b=>b.style.display=v==='scan'?'':'none');refresh();
if(v==='walk'&&g)msg('Joystick à gauche pour marcher, glissez à droite pour regarder. Touchez l\'écran une fois pour activer le son.');else if(v==='walk')msg('Joystick à gauche pour marcher, glissez à droite pour regarder. Le décor en pointillés est deviné d\'après la taille des points.')}
$('tp').onclick=()=>setView('plan');$('ts').onclick=()=>setView('scan');$('tw').onclick=()=>setView('walk');$('tg').onclick=()=>setView('walk',1);$('tc').onclick=()=>setView('cmp');
$('zi').onclick=()=>zoom=Math.min(3,zoom*1.25);$('zo').onclick=()=>zoom=Math.max(.5,zoom/1.25);
$('f').onsubmit=e=>{e.preventDefault();run($('txt').value);$('txt').value=''};
[['Aléatoire',rand],['Lit','lit'],['Armoire','armoire'],['Bureau','bureau'],['TV','tv'],['Canapé','canape'],['Table','table'],['Chaise','chaise'],['Personne','personne'],['Boîtier','radar'],['+ Boîtier','boitier'],['Tourner',()=>{radar.yaw=((radar.yaw||0)+Math.PI/4)%6.2832;refresh();msg('Boîtier 1 tourné de 45°.')}],['Boîtier réel',()=>{$('txt').value='connecter ws://192.168.4.1:81';$('txt').focus();msg('Modifiez l\'adresse puis Envoyer : les données réelles remplacent la simulation.')}],['Vider',()=>run('vide')]].forEach(([n,a])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=typeof a==='function'?a:()=>chip(a);$('chips').appendChild(b)});
msg('Tapez « random » pour une pièce aléatoire, ou touchez le plan pour choisir un endroit.');setView('plan');
